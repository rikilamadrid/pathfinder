name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the kit
        uses: actions/checkout@v4
        with:
          # Tags are needed for the changelog-has-tag rule; the default
          # shallow fetch has none, and the rule would silently skip.
          fetch-depth: 0

      - name: Check out the Wonder Wagon CLI generator
        uses: actions/checkout@v4
        with:
          repository: rikilamadrid/wonder-wagon-ui
          # Decision U requires every consumer proof to name the immutable
          # foundation revision it was generated and checked against.
          ref: 2381be9fdfe2e2e84132134cf8335485d9b95967
          path: wonder-wagon-ui

      - name: Set up Bun for the generator build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build the React-free CLI generator
        working-directory: wonder-wagon-ui
        run: bun install --frozen-lockfile && bun run --filter wonder-wagon-ui build

      - name: Set up Node
        # Two validator rules run the installer rather than describing it:
        # copy-list-installer asks it what it would copy, and adapter-freshness
        # asks its generator whether the committed adapters are current. Without
        # Node both skip themselves, which is the exact failure mode they exist
        # to prevent — so this step must stay ahead of the validator.
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate kit structure
        run: python3 .github/scripts/validate-kit.py

      - name: Test the installer
        # The installer runtime remains dependency-free. This install exposes
        # only the pinned, locally built generator used by the drift check; the
        # generated module committed under src/ is what the package ships.
        working-directory: packages/create-pathfinder
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund && npm test

      - name: Test the render-artifact engine
        # The engine ships under skills/; its tests live here so an installed
        # project never receives them. This step is where the determinism
        # invariant stops being a claim in a reference file — same
        # specification bytes and same renderer version give byte-identical
        # HTML — and becomes something a run either passes or does not.
        #
        # The suite varies the working directory, TZ, LANG/LC_ALL and the
        # ambient environment itself, so it needs no configuration here to mean
        # what it says. It does need Git history: the shipped example cites this
        # repository at a fixed commit, which the fetch-depth: 0 above provides.
        working-directory: packages/render-artifact
        run: npm test

      - name: Test the orchestrate engine
        # Like render-artifact, the engine ships under skills/ and its tests
        # live here so an installed project never receives them. The suite
        # builds real Git repositories and runs the real CLI, because the claim
        # guarantee is Git's refusal to check a branch out twice.
        working-directory: packages/orchestrate
        run: npm test

      - name: Test the shared evidence-reference primitive
        # `lib/evidence-references.mjs` is shipped kit code with no skill of
        # its own, so its tests live here like every engine's. The suite also
        # owns the conformance fixture every consumer runs: this step and the
        # one below execute the same expectations against two different entry
        # points, and a disagreement fails by the reference it disagreed on.
        working-directory: packages/evidence-references
        run: npm test

      - name: Test the blog-post-redactor engine
        # Same shape as the two engines above: it ships under skills/ and its
        # tests live here so an installed project never receives them. The
        # suite builds real Git repositories and runs the real CLI, because the
        # guarantee being checked is that collection reads a repository and
        # changes nothing in it.
        working-directory: packages/blog-post-redactor
        run: npm test

      - name: Test the improvement-ledger engine
        # `reflect`'s engine ships under skills/ like the others, and its tests
        # live here so an installed project never receives them. The suite runs
        # the real CLI against real scratch projects, because the guarantees
        # being checked are about a file on disk: that the engine writes exactly
        # one path, that a harvest is the same bytes in any timezone or locale,
        # and that it reads evidence references through the shared primitive
        # rather than a grammar of its own.
        working-directory: packages/reflect
        run: npm test

      - name: Assert no root manifest
        # NOT_A_FRAMEWORK.md promises the kit has no runtime and no package
        # manager. Nested tooling may carry its own manifest; the root may not.
        run: |
          for f in package.json package-lock.json pnpm-lock.yaml yarn.lock \
                   requirements.txt pyproject.toml Gemfile go.mod; do
            if [ -e "$f" ]; then
              echo "::error file=$f::$f at the repository root contradicts NOT_A_FRAMEWORK.md"
              exit 1
            fi
          done
          echo "OK — no manifest at the repository root."
